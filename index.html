<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Yanban-English Dictionary</title>
<style>
:root{
  --bg:#161a1f; --panel:#1c2128; --panel2:#13161b; --border:#2c323c; --border2:#333a45;
  --text:#EDE7DA; --text-dim:#b3bac6; --text-mute:#8b93a1; --text-faint:#6f7787;
  --gold:#C9A24B; --gold-light:#dab161; --red:#e0685a; --green:#4a8f6b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:'Myanmar Text','Noto Sans Myanmar','Pyidaungsu','Padauk',-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text); min-height:100vh;
}
#root{min-height:100vh;display:flex;flex-direction:column;}
.serif{font-family:Georgia,'Myanmar Text','Noto Sans Myanmar',serif;}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
.wrap{max-width:900px;margin:0 auto;}
.px{padding-left:24px;padding-right:24px;}
@media(min-width:640px){.px{padding-left:40px;padding-right:40px;}}

/* header */
.topbar{border-bottom:1px solid var(--border);padding:16px 24px;}
@media(min-width:640px){.topbar{padding:16px 40px;}}
.topbar-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{width:36px;height:36px;border-radius:999px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;}
.brand h1{font-family:Georgia,serif;font-size:20px;font-weight:600;margin:0;color:#F5EFDF;line-height:1.2;}
.brand p{font-family:monospace;font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 0;}
.menu-btn{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border2);color:var(--text-dim);background:transparent;}
.menu-btn:hover{border-color:var(--gold);color:var(--gold);}

/* footer */
footer{padding:12px 24px;border-top:1px solid var(--border);font-family:monospace;font-size:10px;color:#5c6472;display:flex;justify-content:space-between;margin-top:auto;}
@media(min-width:640px){footer{padding:12px 40px;}}

/* menu panel */
.menu-overlay{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;}
.menu-scrim{position:absolute;inset:0;background:rgba(9,11,14,.97);}
.menu-panel{position:relative;width:100%;max-width:320px;height:100%;padding:20px;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--border2);overflow-y:auto;}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.menu-title{font-family:Georgia,serif;font-size:18px;color:#F5EFDF;}
.menu-nav{flex:1;display:flex;flex-direction:column;gap:4px;}
.menu-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:6px;font-size:14px;background:transparent;border:none;color:var(--text-dim);text-align:left;}
.menu-item .lbl{display:flex;align-items:center;gap:10px;}
.menu-item.active{background:#2a3038;color:var(--gold);}
.menu-badge{background:var(--gold);color:var(--bg);font-family:monospace;font-size:10px;border-radius:999px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.menu-foot{padding-top:16px;margin-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;}
.menu-foot-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;font-size:14px;background:transparent;border:none;color:var(--text-dim);text-align:left;}
.menu-foot-btn:hover,.menu-item:hover{background:#22262e;}
.close-btn{background:none;border:none;color:var(--text-mute);}

/* cards */
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px 12px 12px 16px;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.85;border-radius:6px 0 0 6px;}
.card:hover{border-color:#3a4250;}

/* buttons */
.btn{font-size:14px;padding:8px 16px;border-radius:6px;border:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn-gold{background:var(--gold);color:var(--bg);font-weight:600;}
.btn-gold:hover{background:var(--gold-light);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border2);}
.btn-ghost:hover{border-color:#4a5261;}
.btn-red{background:var(--red);color:var(--bg);font-weight:600;}
.btn-red:hover{background:#e87f73;}
.btn-green{background:var(--green);color:var(--bg);font-weight:600;font-size:12px;padding:6px 12px;}
.btn-outline-red{background:transparent;border:1px solid var(--red);color:var(--red);font-size:12px;padding:6px 12px;}
.icon-btn{padding:6px;border-radius:6px;border:none;background:transparent;color:var(--text-mute);display:inline-flex;}
.icon-btn:hover{background:#252b33;}
.icon-btn.gold:hover{color:var(--gold);}
.icon-btn.red:hover{color:var(--red);}

/* inputs */
.input,.textarea,select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:8px 12px;font-size:14px;color:var(--text);}
.input:focus,.textarea:focus{outline:none;box-shadow:0 0 0 2px var(--gold);}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-family:monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal-box{background:var(--panel);border:1px solid var(--border2);border-radius:8px;width:100%;max-width:420px;padding:24px;max-height:85vh;overflow-y:auto;}
.modal-box.wide{max-width:640px;}

/* dictionary */
.dict-toolbar{padding:20px 24px;border-bottom:1px solid var(--border);background:var(--panel2);}
@media(min-width:640px){.dict-toolbar{padding:20px 40px;}}
.dict-toolbar-row{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
@media(min-width:640px){.dict-toolbar-row{flex-direction:row;}}
.search-wrap{position:relative;flex:1;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);}
.search-wrap input{padding-left:40px;}
.swap-btn{font-family:monospace;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--border2);border-radius:6px;padding:10px 16px;color:var(--text-dim);background:transparent;white-space:nowrap;}
.swap-btn:hover{border-color:var(--gold);color:var(--gold);}
.untrans-row{max-width:900px;margin:12px auto 0;}
.untrans-row label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
.letter-head{font-family:monospace;font-size:12px;letter-spacing:.15em;color:var(--gold);margin-bottom:12px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.entry-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.entry-main{min-width:0;}
.entry-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.entry-en{font-family:Georgia,serif;font-size:16px;font-weight:600;color:#F5EFDF;}
.entry-arrow{color:#5c6472;}
.entry-yb{font-family:monospace;font-size:14px;color:var(--gold-light);}
.entry-empty{font-family:monospace;font-size:12px;color:var(--text-faint);font-style:italic;}
.entry-meaning{font-size:14px;color:var(--text-dim);margin-top:4px;}
.entry-example{font-size:12px;color:#7d8492;margin-top:4px;font-style:italic;}
.pending-badge{font-family:monospace;font-size:10px;text-transform:uppercase;color:var(--gold-light);border-radius:4px;padding:2px 6px;border:1px solid rgba(218,177,97,.4);display:inline-flex;align-items:center;gap:4px;}

/* alphabet */
.alpha-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(min-width:480px){.alpha-grid{grid-template-columns:repeat(5,1fr);}}
@media(min-width:768px){.alpha-grid{grid-template-columns:repeat(6,1fr);}}
.alpha-tile{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:8px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.alpha-tile:hover{border-color:var(--gold);}
.alpha-tile button{background:none;border:none;color:inherit;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.alpha-letter{font-family:Georgia,serif;font-size:22px;font-weight:600;color:#F5EFDF;}
.alpha-audio-icon{color:var(--gold);margin-top:6px;}
.alpha-noaudio{font-family:monospace;font-size:8px;color:#5c6472;margin-top:6px;}
.alpha-upload{position:absolute;bottom:4px;right:4px;width:20px;height:20px;border-radius:4px;background:#252b33;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-mute);}

/* misc */
.mb-1{margin-bottom:6px;}.mb-2{margin-bottom:12px;}.mb-3{margin-bottom:24px;}
.mt-1{margin-top:6px;}.mt-2{margin-top:12px;}.mt-3{margin-top:24px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.flex-row{display:flex;align-items:center;}
.gap-1{gap:6px;}.gap-2{gap:10px;}
.space-y > * + *{margin-top:10px;}
.space-y-lg > * + *{margin-top:40px;}
.muted{color:var(--text-mute);}
.center-pad{text-align:center;padding:60px 0;font-size:14px;color:var(--text-mute);}
h2.section-title{font-family:Georgia,serif;font-size:20px;color:#F5EFDF;margin:0;}
.err-box{background:#252b1f;border:1px solid rgba(218,177,97,.4);border-radius:6px;padding:14px;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none !important;}
</style>
</head>

<script>
(function(){
"use strict";

/* ================= tiny DOM helper ================= */
function h(tag, attrs) {
  var el = document.createElement(tag);
  var children = Array.prototype.slice.call(arguments, 2);
  if (attrs) {
    for (var k in attrs) {
      var v = attrs[k];
      if (v === false || v == null) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'style' && typeof v === 'object') { for (var sk in v) el.style[sk] = v[sk]; }
      else if (k === 'checked' || k === 'disabled') { el[k] = !!v; }
      else el.setAttribute(k, v);
    }
  }
  function addChild(c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(addChild); return; }
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  children.forEach(addChild);
  return el;
}

  svg.setAttribute("width", size || 16);
  svg.setAttribute("height", size || 16);

  svg.setAttribute("stroke", "currentColor");

function sset(key, shared, value){

  {id:"g1",title_en:"Parts of Speech",content_en:"English words fall into a few basic jobs: nouns name people/places/things (dog, city), verbs show action or state (run, is), adjectives describe nouns (happy, tall), adverbs describe verbs/adjectives (quickly, very), and pronouns replace nouns (he, they). Example: 'The happy dog runs quickly.'",content_my:""},
  {id:"g2",title_en:"Basic Word Order",content_en:"A basic English sentence follows Subject + Verb + Object (SVO). Example: 'She (subject) reads (verb) books (object).' Unlike some languages, the order usually cannot be rearranged freely.",content_my:""},
  {id:"g3",title_en:"The Verb 'To Be'",content_en:"'Be' changes form with the subject: I am, you/we/they are, he/she/it is. Example: 'I am a student. She is a teacher. They are friends.'",content_my:""},
  {id:"g4",title_en:"Present Simple Tense",content_en:"Used for facts, habits, and routines. Add -s/-es for he/she/it. Example: 'I work every day. She works every day.'",content_my:""},
  {id:"g5",title_en:"Past Simple Tense",content_en:"Used for finished actions. Regular verbs add -ed (walk → walked). Many common verbs are irregular (go → went, eat → ate). Example: 'Yesterday I walked to school. He went home.'",content_my:""},
  {id:"g6",title_en:"Future Tense",content_en:"Use 'will' for decisions/predictions, and 'going to' for plans. Example: 'I will call you later.' / 'We are going to visit Bagan next month.'",content_my:""},
  {id:"g7",title_en:"Plural Nouns",content_en:"Most nouns add -s (book → books). Words ending in -s, -x, -ch, -sh add -es (box → boxes). Some are irregular (child → children, man → men).",content_my:""},
  {id:"g8",title_en:"Articles: a / an / the",content_en:"Use 'a' before consonant sounds and 'an' before vowel sounds for a non-specific noun (a dog, an apple). Use 'the' for a specific, already-known noun (the dog we saw yesterday).",content_my:""},

function persistEntries(next){ S.entries=next; sset(ENTRIES_KEY,true,next); render(); }
function persistConfig(next){ S.config=next; sset(CONFIG_KEY,true,next); render(); }
function persistLessons(next){ S.lessons=next; sset(LESSONS_KEY,true,next); render(); }
function persistGrammar(next){ S.grammar=next; sset(GRAMMAR_KEY,true,next); render(); }
function persistSongs(next){ S.songs=next; sset(SONGS_KEY,true,next); render(); }
function persistAbout(next){ S.about=next; sset(ABOUT_KEY,true,next); render(); }
function persistAlphaAudio(next){ S.alphaAudio=next; sset(ALPHABET_AUDIO_KEY,true,next); render(); }
function persistIdentity(next){ S.identity=next; sset(IDENTITY_KEY,false,next); render(); }
function persistLang(next){ S.lang=next; sset(LANG_KEY,false,next); render(); }

/* ================= render root ================= */
var root = document.getElementById("root");
function render(){
  var prevActive = document.activeElement;
  var prevId = prevActive && prevActive.id;
  var prevSelStart, prevSelEnd;
  try { prevSelStart = prevActive.selectionStart; prevSelEnd = prevActive.selectionEnd; } catch(e){}
  var scrollY = window.scrollY;
  root.innerHTML = "";
  root.appendChild(buildApp());
  if (prevId) {
    var el = document.getElementById(prevId);
    if (el) {
      el.focus();
      if (typeof prevSelStart === 'number' && el.setSelectionRange) {
        try { el.setSelectionRange(prevSelStart, prevSelEnd); } catch(e){}
      }
    }
  }
  window.scrollTo(0, scrollY);
}

function role(){ return (S.identity && S.identity.role) || "guest"; }
function isOwner(){ return role()==="owner"; }
function isDeveloper(){ return role()==="developer"; }

function buildApp(){
  var frag = h('div', {style:{minHeight:'100vh',display:'flex',flexDirection:'column'}});
  if (S.showOnboard) frag.appendChild(buildOnboardModal());
  frag.appendChild(buildTopBar());
  if (S.menuOpen) frag.appendChild(buildMenuPanel());
  var main = h('main', {style:{flex:'1'}});
  if (S.view==="dictionary") main.appendChild(buildDictionaryView());
  else if (S.view==="alphabet") main.appendChild(buildAlphabetView());
  else if (S.view==="lessons") main.appendChild(buildLessonsView());
  else if (S.view==="grammar") main.appendChild(buildGrammarView());
  else if (S.view==="songs") main.appendChild(buildSongsView());
  else if (S.view==="about") main.appendChild(buildAboutView());
  else if (S.view==="team" && isOwner()) main.appendChild(buildTeamView());
  frag.appendChild(main);
  frag.appendChild(h('footer', null,
    h('span', null, 'Yanban Project'),
    h('span', null, S.identity ? (S.identity.name + ' · ' + role()) : 'guest')
  ));
  return frag;
}

/* ---------- top bar ---------- */
function buildTopBar(){
  var pendingCount = S.entries.filter(function(e){ return e.pending; }).length;
  var joinReqCount = (S.config.joinRequests||[]).length;
  return h('header', {class:'topbar'},
    h('div', {class:'topbar-inner'},
      h('div', {class:'brand'},
        h('div', {class:'brand-icon'}, icon('book',18)),
        h('div', null,
          h('h1', null, 'Yanban-English Dictionary'),
          h('p', null, S.entries.length + ' ' + t('entries'))
        )
      ),
      h('button', {class:'menu-btn', onclick:function(){ S.menuOpen=true; render(); }}, icon('menu',18))
    )
  );
}

/* ---------- menu panel ---------- */
function buildMenuPanel(){
  var NAV = [
    {key:"dictionary",label:t("dictionary"),i:"book"},
    {key:"alphabet",label:t("alphabet"),i:"cap"},
    {key:"lessons",label:t("lessons"),i:"book"},
    {key:"grammar",label:t("grammar"),i:"cap"},
    {key:"songs",label:t("songs"),i:"music"},
    {key:"about",label:t("about"),i:"info"}
  ];
  var pendingCount = S.entries.filter(function(e){ return e.pending; }).length;
  var joinReqCount = (S.config.joinRequests||[]).length;
  if (isOwner()) NAV.push({key:"team",label:t("team"),i:"shield",badge:pendingCount+joinReqCount});

  var nav = h('nav', {class:'menu-nav'});
  NAV.forEach(function(n){
    var active = S.view===n.key;
    var btn = h('button', {class:'menu-item'+(active?' active':''), onclick:function(){ S.view=n.key; S.menuOpen=false; render(); }},
      h('span', {class:'lbl'}, icon(n.i,16), n.label)
    );
    if (n.badge) btn.appendChild(h('span', {class:'menu-badge'}, String(n.badge)));
    nav.appendChild(btn);
  });

  return h('div', {class:'menu-overlay'},
    h('div', {class:'menu-scrim', onclick:function(){ S.menuOpen=false; render(); }}),
    h('div', {class:'menu-panel'},
      h('div', {class:'menu-head'},
        h('span', {class:'menu-title'}, t('menu')),
        h('button', {class:'close-btn', onclick:function(){ S.menuOpen=false; render(); }}, icon('x',18))
      ),
      nav,
      h('div', {class:'menu-foot'},
        h('button', {class:'menu-foot-btn', onclick:function(){ persistLang(S.lang==='en'?'my':'en'); }},
          icon('globe',16), (S.lang==='en'?'English':'မြန်မာ')
        ),
        h('button', {class:'menu-foot-btn', onclick:function(){ S.menuOpen=false; S.showOnboard=true; render(); }},
          icon('login',16), (S.identity ? (S.identity.name+' ('+role()+')') : 'Sign in')
        )
      )
    )
  );
}

/* ---------- modal helper ---------- */
function Modal(opts, children){
  var box = h('div', {class:'modal-box'+(opts.wide?' wide':'')});
  children.forEach(function(c){ if (c) box.appendChild(c); });
  var overlay = h('div', {class:'modal-overlay', onclick:function(e){ if (e.target===overlay && opts.onClose) opts.onClose(); }});
  overlay.appendChild(box);
  return overlay;
}
function Field(label, inputEl){
  return h('div', {class:'field'}, h('label', null, label), inputEl);
}

/* ---------- onboarding ---------- */
function buildOnboardModal(){
  var ui = S.ui.onboard;
  function goGuest(){
    persistIdentity({name: ui.name.trim() || "Guest", role:"guest"});
    S.showOnboard=false; ui.step="choose"; ui.name=""; ui.pin=""; ui.error=""; ui.pendingNotice=false;
    render();
  }
  function submitOwner(){
    ui.error="";
    if (!ui.name.trim()) { ui.error="နာမည် ထည့်ပါ"; render(); return; }
    if (!S.config.ownerPin) {
      if (ui.pin.trim().length<4) { ui.error="PIN အနည်းဆုံး ၄ လုံး ထည့်ပါ"; render(); return; }
      S.config = Object.assign({}, S.config, {ownerPin: ui.pin.trim()});
      sset(CONFIG_KEY,true,S.config);
      persistIdentity({name:ui.name.trim(), role:"owner"});
    } else {
      if (ui.pin.trim() !== S.config.ownerPin) { ui.error="PIN မှားနေပါသည်"; render(); return; }
      persistIdentity({name:ui.name.trim(), role:"owner"});
    }
    S.showOnboard=false; ui.step="choose"; ui.name=""; ui.pin=""; ui.error="";
    render();
  }
  function submitDeveloper(){
    ui.error="";
    if (!ui.name.trim()) { ui.error="နာမည် ထည့်ပါ"; render(); return; }
    var match = (S.config.developers||[]).some(function(d){ return d.name.toLowerCase()===ui.name.trim().toLowerCase(); });
    if (match) {
      persistIdentity({name:ui.name.trim(), role:"developer"});
      S.showOnboard=false; ui.step="choose"; ui.name=""; render();
    } else {
      ui.pendingNotice=true; render();
    }
  }
  function continueAsGuestAfterRequest(){
    var already = (S.config.joinRequests||[]).some(function(r){ return r.name.toLowerCase()===ui.name.trim().toLowerCase(); });
    var joinRequests = already ? S.config.joinRequests : (S.config.joinRequests||[]).concat([{name:ui.name.trim(), requestedAt:Date.now()}]);
    S.config = Object.assign({}, S.config, {joinRequests:joinRequests});
    sset(CONFIG_KEY,true,S.config);
    persistIdentity({name:ui.name.trim(), role:"guest"});
    S.showOnboard=false; ui.step="choose"; ui.name=""; ui.pendingNotice=false;
    render();
  }

  var body = [];
  body.push(h('h2', {class:'serif', style:{fontSize:'18px',fontWeight:'600',color:'#F5EFDF',margin:'0 0 4px'}}, 'Yanban မှ ကြိုဆိုပါတယ်'));
  body.push(h('p', {class:'muted', style:{fontSize:'12px',margin:'0 0 20px'}}, 'သင့်ရဲ့ role ကို ရွေးချယ်ပါ'));

  if (ui.step==="choose") {
    body.push(h('div', {class:'space-y'},
      h('button', {class:'btn btn-ghost', style:{width:'100%',justifyContent:'flex-start'}, onclick:function(){ ui.step="owner-pin"; render(); }}, icon('shield',15), 'Owner (project owner)'),
      h('button', {class:'btn btn-ghost', style:{width:'100%',justifyContent:'flex-start'}, onclick:function(){ ui.step="dev-name"; ui.pendingNotice=false; ui.error=""; render(); }}, icon('users',15), 'Developer (translation team)'),
      h('button', {class:'btn btn-ghost', style:{width:'100%',justifyContent:'flex-start'}, onclick:goGuest}, icon('book',15), 'Guest (view only)')
    ));
  } else if (ui.step==="owner-pin") {
    var nameInput = h('input', {class:'input', id:'ob-name', value:ui.name, oninput:function(e){ ui.name=e.target.value; }});
    var pinInput = h('input', {class:'input', type:'password', id:'ob-pin', value:ui.pin, oninput:function(e){ ui.pin=e.target.value; }});
    body.push(h('div', {class:'space-y'},
      Field('Name', nameInput),
      Field(S.config.ownerPin?'Owner PIN':'Set a new Owner PIN (min 4 digits)', pinInput),
      ui.error ? h('p', {style:{fontSize:'12px',color:'var(--red)',margin:0}}, ui.error) : null,
      h('div', {class:'flex-row gap-2', style:{paddingTop:'4px'}},
        h('button', {class:'btn btn-gold', style:{flex:'1'}, onclick:submitOwner}, 'Continue'),
        h('button', {class:'btn btn-ghost', onclick:function(){ ui.step="choose"; render(); }}, 'Back')
      )
    ));
  } else if (ui.step==="dev-name" && !ui.pendingNotice) {
    var devNameInput = h('input', {class:'input', id:'ob-devname', value:ui.name, oninput:function(e){ ui.name=e.target.value; }});
    body.push(h('div', {class:'space-y'},
      Field('Name (owner ထံမှာ မှတ်ပုံတင်ထားတဲ့ အတိုင်း)', devNameInput),
      ui.error ? h('p', {style:{fontSize:'12px',color:'var(--red)',margin:0}}, ui.error) : null,
      h('div', {class:'flex-row gap-2', style:{paddingTop:'4px'}},
        h('button', {class:'btn btn-gold', style:{flex:'1'}, onclick:submitDeveloper}, 'Continue'),
        h('button', {class:'btn btn-ghost', onclick:function(){ ui.step="choose"; render(); }}, 'Back')
      )
    ));
  } else if (ui.step==="dev-name" && ui.pendingNotice) {
    body.push(h('div', {class:'space-y'},
      h('div', {class:'err-box'},
        h('p', {style:{fontSize:'14px',color:'var(--gold-light)',margin:0}}, '"'+ui.name.trim()+'" နာမည်ဟာ Owner ရဲ့ developer list ထဲမှာ မတွေ့ပါ။'),
        h('p', {style:{fontSize:'12px',color:'var(--text-dim)',margin:'6px 0 0'}}, 'Owner ဆီ join request ပို့ပေးလိုက်ပါပြီ — Owner က Team & Review ထဲကနေ Approve လုပ်ပေးမှ Developer အဖြစ် ဝင်ရောက် ပြင်ဆင်နိုင်ပါမယ်။ ယခုအတွက် Guest အနေနဲ့ ကြည့်ရှုနိုင်ပါတယ်။')
      ),
      h('div', {class:'flex-row gap-2', style:{paddingTop:'4px'}},
        h('button', {class:'btn btn-gold', style:{flex:'1'}, onclick:continueAsGuestAfterRequest}, 'Guest အနေနဲ့ ဆက်သွားမည်'),
        h('button', {class:'btn btn-ghost', onclick:function(){ ui.step="choose"; ui.pendingNotice=false; render(); }}, 'Back')
      )
    ));
  }

  return Modal({onClose:function(){}}, body);
}

/* ---------- Dictionary View ---------- */
function buildDictionaryView(){
  var ui = S.ui.dict;
  var owner = isOwner(), dev = isDeveloper();
  var canAdd = owner, canEdit = owner || dev;

  var untranslatedCount = S.entries.filter(function(it){ return !it.yanban.trim(); }).length;

  var q = ui.query.trim().toLowerCase();
  var list = S.entries;
  if (ui.onlyUntranslated) list = list.filter(function(it){ return !it.yanban.trim(); });
  if (q) {
    list = list.filter(function(it){
      var target = ui.direction==='en' ? it.en : it.yanban;
      var other = ui.direction==='en' ? it.yanban : it.en;
      return target.toLowerCase().indexOf(q)>=0 || other.toLowerCase().indexOf(q)>=0 || (it.meaning||"").toLowerCase().indexOf(q)>=0;
    });
  }
  list = list.slice().sort(function(a,b){
    var av = ui.direction==='en'?a.en:a.yanban, bv = ui.direction==='en'?b.en:b.yanban;
    return av.localeCompare(bv);
  });

  var visible = list.slice(0, ui.visibleCount);
  var grouped = {};
  var order = [];
  visible.forEach(function(it){
    var key = letterOf(ui.direction==='en'?it.en:it.yanban);
    if (!grouped[key]) { grouped[key]=[]; order.push(key); }
    grouped[key].push(it);
  });
  order.sort(function(a,b){ return a.localeCompare(b); });

  function openAdd(){ ui.editingId=null; ui.form={en:"",yanban:"",meaning:"",example:""}; ui.formOpen=true; render(); }
  function openEdit(entry){
    ui.editingId = entry.id;
    if (owner) ui.form = {en:entry.en, yanban:entry.yanban, meaning:entry.meaning||"", example:entry.example||""};
    else {
      var p = entry.pending;
      ui.form = {en:entry.en, yanban:p?p.yanban:entry.yanban, meaning:p?p.meaning:(entry.meaning||""), example:p?p.example:(entry.example||"")};
    }
    ui.formOpen=true; render();
  }
  function closeForm(){ ui.formOpen=false; ui.editingId=null; render(); }
  function submitForm(e){
    e.preventDefault();
    if (!ui.form.en.trim()) return;
    if (ui.editingId) {
      if (owner) {
        persistEntries(S.entries.map(function(it){
          return it.id===ui.editingId ? Object.assign({},it,{en:ui.form.en.trim(),yanban:ui.form.yanban.trim(),meaning:ui.form.meaning.trim(),example:ui.form.example.trim()}) : it;
        }));
      } else {
        persistEntries(S.entries.map(function(it){
          return it.id===ui.editingId ? Object.assign({},it,{pending:{yanban:ui.form.yanban.trim(),meaning:ui.form.meaning.trim(),example:ui.form.example.trim(),submittedBy:(S.identity&&S.identity.name)||"unknown",submittedAt:Date.now()}}) : it;
        }));
      }
    } else if (canAdd) {
      persistEntries(S.entries.concat([{id:uid(),en:ui.form.en.trim(),yanban:ui.form.yanban.trim(),meaning:ui.form.meaning.trim(),example:ui.form.example.trim(),createdAt:Date.now()}]));
    }
    closeForm();
  }
  function doDelete(id){ persistEntries(S.entries.filter(function(it){ return it.id!==id; })); ui.confirmDelete=null; render(); }

  var container = h('div', null);

  var searchInput = h('input', {class:'input', id:'dict-search', value:ui.query,
    placeholder: ui.direction==='en' ? 'English စာလုံးရှာရန်...' : 'Yanban စာလုံးရှာရန်...',
    oninput:function(e){ ui.query=e.target.value; ui.visibleCount=150; render(); }
  });
  var toolbar = h('div', {class:'dict-toolbar'},
    h('div', {class:'dict-toolbar-row'},
      h('div', {class:'search-wrap'}, icon('search',16), searchInput),
      h('button', {class:'swap-btn', onclick:function(){ ui.direction = ui.direction==='en'?'yb':'en'; ui.visibleCount=150; render(); }},
        icon('swap',14), (ui.direction==='en' ? 'English → Yanban' : 'Yanban → English')
      ),
      canAdd ? h('button', {class:'btn btn-gold', onclick:openAdd}, icon('plus',16), t('addWord')) : null
    )
  );
  if (untranslatedCount>0) {
    var cb = h('input', {type:'checkbox', checked:ui.onlyUntranslated, onchange:function(e){ ui.onlyUntranslated=e.target.checked; ui.visibleCount=150; render(); }});
    toolbar.appendChild(h('div', {class:'untrans-row'},
      h('label', null, cb, 'ဘာသာမပြန်ရသေးသော စာလုံးများသာ ('+untranslatedCount+')')
    ));
  }
  container.appendChild(toolbar);

  var body = h('div', {class:'px', style:{paddingTop:'32px',paddingBottom:'32px'}});
  var wrap = h('div', {class:'wrap'});
  if (list.length===0) {
    wrap.appendChild(h('p', {class:'center-pad'}, '"'+ui.query+'" နှင့် ကိုက်ညီသော စာလုံး မတွေ့ပါ'));
  } else {
    var sections = h('div', {class:'space-y-lg'});
    order.forEach(function(letter){
      var items = grouped[letter];
      var sec = h('section', null,
        h('div', {class:'letter-head'}, letter),
        h('div', {class:'space-y'})
      );
      var itemsWrap = sec.querySelector('.space-y');
      items.forEach(function(it){
        var showPending = it.pending && (role()==='owner' || (S.identity && it.pending.submittedBy===S.identity.name));
        var displayYanban = ui.direction==='en' ? it.yanban : it.en;
        var mainDiv = h('div', {class:'entry-main'},
          h('div', {class:'entry-head'},
            h('span', {class:'entry-en'}, ui.direction==='en'?it.en:it.yanban),
            h('span', {class:'entry-arrow'}, '→'),
            displayYanban ? h('span', {class:'entry-yb'}, displayYanban) : h('span', {class:'entry-empty'}, 'ဘာသာမပြန်ရသေးပါ'),
            showPending ? h('span', {class:'pending-badge'}, icon('clock',10), 'pending: '+it.pending.yanban) : null
          ),
          it.meaning ? h('p', {class:'entry-meaning'}, it.meaning) : null,
          it.example ? h('p', {class:'entry-example'}, '"'+it.example+'"') : null
        );
        var actions = h('div', {class:'flex-row gap-1', style:{flexShrink:'0'}});
        if (canEdit) actions.appendChild(h('button', {class:'icon-btn gold', onclick:function(){ openEdit(it); }}, icon('pencil',14)));
        if (owner) actions.appendChild(h('button', {class:'icon-btn red', onclick:function(){ ui.confirmDelete=it.id; render(); }}, icon('trash',14)));
        itemsWrap.appendChild(h('div', {class:'card entry-row'}, mainDiv, actions));
      });
      sections.appendChild(sec);
    });
    wrap.appendChild(sections);
    if (ui.visibleCount < list.length) {
      wrap.appendChild(h('button', {class:'btn btn-ghost', style:{width:'100%',marginTop:'24px'}, onclick:function(){ ui.visibleCount+=150; render(); }},
        visible.length+' / '+list.length+' ပြထားသည် — နောက်ထပ် ပြရန်'
      ));
    }
  }
  body.appendChild(wrap);
  container.appendChild(body);

  if (ui.formOpen) {
    var enInput = h('input', {class:'input', id:'dict-en', value:ui.form.en, disabled: !!ui.editingId && !owner, required:true, oninput:function(e){ ui.form.en=e.target.value; }});
    var ybInput = h('input', {class:'input', id:'dict-yb', value:ui.form.yanban, placeholder:'Yanban ဘာသာ', oninput:function(e){ ui.form.yanban=e.target.value; }});
    var meanInput = h('input', {class:'input', id:'dict-mean', value:ui.form.meaning, oninput:function(e){ ui.form.meaning=e.target.value; }});
    var exInput = h('input', {class:'input', id:'dict-ex', value:ui.form.example, oninput:function(e){ ui.form.example=e.target.value; }});
    var formEl = h('form', {class:'space-y', onsubmit:submitForm},
      Field('English word', enInput),
      Field('Yanban word', ybInput),
      Field('အဓိပ္ပာယ် (ဗမာလို) — optional', meanInput),
      Field('ဥပမာဝါကျ — optional', exInput),
      h('div', {class:'flex-row gap-2', style:{paddingTop:'8px'}},
        h('button', {type:'submit', class:'btn btn-gold', style:{flex:'1'}}, (ui.editingId && !owner) ? t('submitForReview') : t('save')),
        h('button', {type:'button', class:'btn btn-ghost', onclick:closeForm}, t('cancel'))
      )
    );
    container.appendChild(Modal({onClose:closeForm},[
      h('div', {class:'flex-between', style:{marginBottom:'20px'}},
        h('h2', {class:'serif', style:{fontSize:'18px',fontWeight:'600',color:'#F5EFDF',margin:0}}, ui.editingId ? 'စာလုံးပြင်ရန်' : 'စာလုံးအသစ်ထည့်ရန်'),
        h('button', {class:'close-btn', onclick:closeForm}, icon('x',18))
      ),
      formEl
    ]));
  }
  if (ui.confirmDelete) {
    container.appendChild(Modal({onClose:function(){ ui.confirmDelete=null; render(); }},[
      h('p', {style:{fontSize:'14px',color:'var(--text)',margin:'0 0 20px'}}, 'ဒီစာလုံးကို ဖျက်မှာ သေချာပါသလား?'),
      h('div', {class:'flex-row gap-2'},
        h('button', {class:'btn btn-red', style:{flex:'1'}, onclick:function(){ doDelete(ui.confirmDelete); }}, 'ဖျက်မည်'),
        h('button', {class:'btn btn-ghost', onclick:function(){ ui.confirmDelete=null; render(); }}, 'မဖျက်တော့ပါ')
      )
    ]));
  }

  return container;
}

/* ---------- Alphabet View ---------- */
function buildAlphabetView(){
  var canEdit = isOwner() || isDeveloper();
  var ui = S.ui.alphabet;

  function play(letter){
    var src = S.alphaAudio[letter];
    if (!src) return;
    var a = new Audio(src);
    a.play().catch(function(){});
  }
  function handleFile(letter, file){
    if (!file) return;
    if (file.size > 400*1024) { alert('Audio file ကို 400KB အောက် သုံးပါ (short clip)'); return; }
    ui.uploadingLetter = letter; render();
    var reader = new FileReader();
    reader.onload = function(){
      var next = Object.assign({}, S.alphaAudio); next[letter]=reader.result;
      ui.uploadingLetter=null;
      persistAlphaAudio(next);
    };
    reader.onerror = function(){ ui.uploadingLetter=null; render(); };
    reader.readAsDataURL(file);
  }

  var grid = h('div', {class:'alpha-grid'});
  ALPHABET.forEach(function(letter){
    var hasAudio = !!S.alphaAudio[letter];
    var tile = h('div', {class:'alpha-tile'},
      h('button', {onclick:function(){ play(letter); }},
        h('span', {class:'alpha-letter'}, letter+letter.toLowerCase()),
        hasAudio ? h('div', {class:'alpha-audio-icon'}, icon('volume',13)) : h('span', {class:'alpha-noaudio'}, 'no audio')
      )
    );
    if (canEdit) {
      var fileInput = h('input', {type:'file', accept:'audio/*', style:{display:'none'}, onchange:function(e){ handleFile(letter, e.target.files[0]); }});
      var lab = h('label', {class:'alpha-upload'}, ui.uploadingLetter===letter ? icon('loader',11,{}) : icon('upload',11), fileInput);
      if (ui.uploadingLetter===letter) lab.firstChild.classList.add('spin');
      tile.appendChild(lab);
    }
    grid.appendChild(tile);
  });

  return h('div', {class:'px', style:{paddingTop:'32px',paddingBottom:'32px'}},
    h('div', {class:'wrap'},
      h('h2', {class:'section-title mb-1'}, t('alphabet')),
      h('p', {class:'muted', style:{fontSize:'14px',marginBottom:'24px'}}, 'စာလုံးကို နှိပ်ပြီး အသံနားထောင်ပါ'+(canEdit?' · upload icon ကနေ အသံ ထည့်နိုင်ပါတယ်':'')),
      grid
    )
  );
}

/* ---------- Lessons View ---------- */
function buildLessonsView(){
  var canEdit = isOwner();
  var ui = S.ui.lessons;

  function openNew(){ ui.editingId="new"; ui.form={title:"",body:""}; render(); }
  function openEdit(l){ ui.editingId=l.id; ui.form={title:l.title, body:l.body}; render(); }
  function save(){
    if (!ui.form.title.trim()) return;
    if (ui.editingId==="new") persistLessons(S.lessons.concat([{id:uid("l"), title:ui.form.title.trim(), body:ui.form.body, createdAt:Date.now()}]));
    else persistLessons(S.lessons.map(function(l){ return l.id===ui.editingId ? Object.assign({},l,{title:ui.form.title.trim(),body:ui.form.body}) : l; }));
    ui.editingId=null; render();
  }
  function remove(id){ persistLessons(S.lessons.filter(function(l){ return l.id!==id; })); }

  var wrap = h('div', {class:'wrap'},
    h('div', {class:'flex-between mb-3'},
      h('h2', {class:'section-title'}, t('lessons')),
      canEdit ? h('button', {class:'btn btn-gold', onclick:openNew}, icon('plus',15), 'Add Lesson') : null
    )
  );
  var list = h('div', {class:'space-y'});
  list.appendChild(h('button', {class:'card', style:{width:'100%',textAlign:'left',display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--panel)',border:'1px solid var(--border)',cursor:'pointer'}, onclick:function(){ S.view="alphabet"; render(); }},
    h('div', null,
      h('span', {class:'mono', style:{fontSize:'10px',color:'var(--gold)',textTransform:'uppercase'}}, 'Lesson 1'),
      h('p', {class:'serif', style:{fontSize:'16px',color:'#F5EFDF',margin:0}}, 'Yanban Alphabet')
    ),
    icon('chevron',16,{color:'var(--text-faint)'})
  ));

  S.lessons.forEach(function(l, idx){
    var openId = ui.openId;
    var headRow = h('div', {class:'flex-between'},
      h('button', {style:{textAlign:'left',flex:'1',background:'none',border:'none',color:'inherit',padding:0}, onclick:function(){ ui.openId = (openId===l.id?null:l.id); render(); }},
        h('span', {class:'mono', style:{fontSize:'10px',color:'var(--gold)',textTransform:'uppercase'}}, 'Lesson '+(idx+2)),
        h('p', {class:'serif', style:{fontSize:'16px',color:'#F5EFDF',margin:0}}, l.title)
      )
    );
    if (canEdit) headRow.appendChild(h('div', {class:'flex-row gap-1', style:{flexShrink:'0'}},
      h('button', {class:'icon-btn gold', onclick:function(){ openEdit(l); }}, icon('pencil',14)),
      h('button', {class:'icon-btn red', onclick:function(){ remove(l.id); }}, icon('trash',14))
    ));
    var card = h('div', {class:'card'}, headRow);
    if (ui.openId===l.id && l.body) card.appendChild(h('p', {style:{fontSize:'14px',color:'var(--text-dim)',marginTop:'10px',whiteSpace:'pre-wrap'}}, l.body));
    list.appendChild(card);
  });
  if (S.lessons.length===0) list.appendChild(h('p', {class:'muted', style:{fontSize:'14px',padding:'20px 0'}}, 'Lesson 2 နှင့် ဆက်လက် ရေးသားနိုင်ပါပြီ'));
  wrap.appendChild(list);

  var container = h('div', {class:'px', style:{paddingTop:'32px',paddingBottom:'32px'}}, wrap);

  if (ui.editingId) {
    var titleInput = h('input', {class:'input', id:'les-title', value:ui.form.title, oninput:function(e){ ui.form.title=e.target.value; }});
    var bodyInput = h('textarea', {class:'textarea', id:'les-body', rows:10, oninput:function(e){ ui.form.body=e.target.value; }}, ui.form.body);
    container.appendChild(Modal({onClose:function(){ ui.editingId=null; render(); }, wide:true},[
      h('h2', {class:'serif', style:{fontSize:'18px',color:'#F5EFDF',margin:'0 0 16px'}}, ui.editingId==="new"?"Add Lesson":"Edit Lesson"),
      h('div', {class:'space-y'},
        Field('Title', titleInput),
        Field('Content', bodyInput),
        h('div', {class:'flex-row gap-2', style:{paddingTop:'4px'}},
          h('button', {class:'btn btn-gold', style:{flex:'1'}, onclick:save}, t('save')),
          h('button', {class:'btn btn-ghost', onclick:function(){ ui.editingId=null; render(); }}, t('cancel'))
        )
      )
    ]));
  }
  return container;
}

/* ---------- Grammar View ---------- */
function buildGrammarView(){
  var canEdit = isOwner();
  var ui = S.ui.grammarv;

  function openNew(){ ui.editingId="new"; ui.form={title_en:"",content_en:"",content_my:""}; render(); }
  function openEdit(g){ ui.editingId=g.id; ui.form={title_en:g.title_en,content_en:g.content_en,content_my:g.content_my||""}; render(); }
  function save(){
    if (!ui.form.title_en.trim()) return;
    if (ui.editingId==="new") persistGrammar(S.grammar.concat([Object.assign({id:uid("g")},ui.form)]));
    else persistGrammar(S.grammar.map(function(g){ return g.id===ui.editingId ? Object.assign({},g,ui.form) : g; }));
    ui.editingId=null; render();
  }
  function remove(id){ persistGrammar(S.grammar.filter(function(g){ return g.id!==id; })); }

  var wrap = h('div', {class:'wrap'},
    h('div', {class:'flex-between mb-3'},
      h('h2', {class:'section-title'}, t('grammar')),
      canEdit ? h('button', {class:'btn btn-gold', onclick:openNew}, icon('plus',15), 'Add') : null
    )
  );
  var list = h('div', {class:'space-y'});
  S.grammar.forEach(function(g){
    var head = h('div', {style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:'8px'}},
      h('p', {class:'serif', style:{fontSize:'16px',color:'#F5EFDF',margin:0}}, g.title_en)
    );
    if (canEdit) head.appendChild(h('div', {class:'flex-row gap-1', style:{flexShrink:'0'}},
      h('button', {class:'icon-btn gold', onclick:function(){ openEdit(g); }}, icon('pencil',14)),
      h('button', {class:'icon-btn red', onclick:function(){ remove(g.id); }}, icon('trash',14))
    ));
    var card = h('div', {class:'card'}, head,
      h('p', {style:{fontSize:'14px',color:'var(--text-dim)',marginTop:'8px'}}, g.content_en)
    );
    if (g.content_my) card.appendChild(h('p', {style:{fontSize:'14px',color:'var(--gold-light)',marginTop:'8px',borderTop:'1px solid var(--border)',paddingTop:'8px'}}, g.content_my));
    else card.appendChild(h('p', {class:'mono', style:{fontSize:'10px',color:'#5c6472',marginTop:'8px',fontStyle:'italic'}}, 'Yanban ဘာသာပြန် မထည့်ရသေးပါ'));
    list.appendChild(card);
  });
  wrap.appendChild(list);
  var container = h('div', {class:'px', style:{paddingTop:'32px',paddingBottom:'32px'}}, wrap);

  if (ui.editingId) {
    var titleInput = h('input', {class:'input', id:'gr-title', value:ui.form.title_en, oninput:function(e){ ui.form.title_en=e.target.value; }});
    var enInput = h('textarea', {class:'textarea', id:'gr-en', rows:4, oninput:function(e){ ui.form.content_en=e.target.value; }}, ui.form.content_en);
    var myInput = h('textarea', {class:'textarea', id:'gr-my', rows:4, oninput:function(e){ ui.form.content_my=e.target.value; }}, ui.form.content_my);
    container.appendChild(Modal({onClose:function(){ ui.editingId=null; render(); }, wide:true},[
      h('h2', {class:'serif', style:{fontSize:'18px',color:'#F5EFDF',margin:'0 0 16px'}}, ui.editingId==="new"?"Add Grammar Point":"Edit"),
      h('div', {class:'space-y'},
        Field('Title', titleInput),
        Field('English explanation', enInput),
        Field('Yanban translation', myInput),
        h('div', {class:'flex-row gap-2', style:{paddingTop:'4px'}},
          h('button', {class:'btn btn-gold', style:{flex:'1'}, onclick:save}, t('save')),
          h('button', {class:'btn btn-ghost', onclick:function(){ ui.editingId=null; render(); }}, t('cancel'))
        )
      )
    ]));
  }
  return container;
}

/* ---------- Songs View ---------- */

  function openNew(){ ui.editingId="new"; ui.form={title:"",lyrics:"",note:""}; render(); }
  function openEdit(s){ ui.editingId=s.id; ui.form={title:s.title,lyrics:s.lyrics,note:s.note||""}; render(); }
  function save(){
    if (!ui.form.title.trim()) return;
    if (ui.editingId==="new") persistSongs(S.songs.concat([Object.assign({id:uid("s")},ui.form,{createdAt:Date.now()})]));
    else persistSongs(S.songs.map(function(s){ return s.id===ui.editingId ? Object.assign({},s,ui.form) : s; }));
    ui.editingId=null; render();
  }
  function remove(id){ persistSongs(S.songs.filter(function(s){ return s.id!==id; })); }

        icon('music',14,{color:'var(--gold)'}),
        h('span', {class:'serif', style:{fontSize:'16px',color:'#F5EFDF'}}, s.title)

    );

  wrap.appendChild(list);
  var container = h('div', {class:'px', style:{paddingTop:'32px',paddingBottom:'32px'}}, wrap);

  if (ui.editingId) {
    var titleInput = h('input', {class:'input', id:'sg-title', value:ui.form.title, oninput:function(e){ ui.form.title=e.target.value; }});
    var lyricsInput = h('textarea', {class:'textarea', id:'sg-lyrics', rows:8, oninput:function(e){ ui.form.lyrics=e.target.value; }}, ui.form.lyrics);
    var noteInput = h('textarea', {class:'textarea', id:'sg-note', rows:3, oninput:function(e){ ui.form.note=e.target.value; }}, ui.form.note);
    container.appendChild(Modal({onClose:function(){ ui.editingId=null; render(); }, wide:true},[
      h('h2', {class:'serif', style:{fontSize:'18px',color:'#F5EFDF',margin:'0 0 16px'}}, ui.editingId==="new"?"Add Song":"Edit Song"),
      h('div', {class:'space-y'},
        Field('Title', titleInput),
        Field('Lyrics (Yanban)', lyricsInput),
        Field('Note / translation — optional', noteInput),
        h('div', {class:'flex-row gap-2', style:{paddingTop:'4px'}},
          h('button', {class:'btn btn-gold', style:{flex:'1'}, onclick:save}, t('save')),
          h('button', {class:'btn btn-ghost', onclick:function(){ ui.editingId=null; render(); }}, t('cancel'))
        )
      )

}

/* ---------- About View ---------- */

  var canEdit = isOwner();
  var ui = S.ui.about;
  if (!ui.form) ui.form = Object.assign({}, S.about);

  function save(){ persistAbout(ui.form); ui.editing=false; }

  var wrap = h('div', {class:'wrap'},
    h('div', {class:'flex-between mb-3'},
      h('h2', {class:'section-title'}, t('about')),
      (canEdit && !ui.editing) ? h('button', {class:'btn btn-ghost', onclick:function(){ ui.editing=true; render(); }}, icon('pencil',14), 'Edit') : null
    )
  );
  if (!ui.editing) {
    wrap.appendChild(h('div', {class:'space-y'},
      h('p', {style:{fontSize:'14px',color:'var(--text-dim)',lineHeight:'1.7'}}, S.about.content_en),
      h('p', {style:{fontSize:'14px',color:'var(--gold-light)',lineHeight:'1.7',borderTop:'1px solid var(--border)',paddingTop:'16px'}}, S.about.content_my)
    ));
  } else {
    var enInput = h('textarea', {class:'textarea', id:'about-en', rows:5, oninput:function(e){ ui.form.content_en=e.target.value; }}, ui.form.content_en);
    var myInput = h('textarea', {class:'textarea', id:'about-my', rows:5, oninput:function(e){ ui.form.content_my=e.target.value; }}, ui.form.content_my);

        h('button', {class:'btn btn-gold', style:{flex:'1'}, onclick:save}, t('save')),

      )
    ));
  }
  return h('div', {class:'px', style:{paddingTop:'32px',paddingBottom:'32px'}}, wrap);
}

/* ---------- Team View ---------- */
function buildTeamView(){
  var ui = S.ui.team;
  var pending = S.entries.filter(function(e){ return e.pending; });

  function addDeveloper(){
    if (!ui.newDev.trim()) return;
    var exists = (S.config.developers||[]).some(function(d){ return d.name.toLowerCase()===ui.newDev.trim().toLowerCase(); });
    if (exists) { ui.newDev=""; render(); return; }
    persistConfig(Object.assign({}, S.config, {developers:(S.config.developers||[]).concat([{name:ui.newDev.trim(),addedAt:Date.now()}])}));
    ui.newDev="";
  }
  function removeDeveloper(name){ persistConfig(Object.assign({}, S.config, {developers:(S.config.developers||[]).filter(function(d){ return d.name!==name; })})); }
  function approveJoin(name){
    persistConfig(Object.assign({}, S.config, {
      developers:(S.config.developers||[]).concat([{name:name,addedAt:Date.now()}]),
      joinRequests:(S.config.joinRequests||[]).filter(function(r){ return r.name!==name; })
    }));
  }
  function dismissJoin(name){ persistConfig(Object.assign({}, S.config, {joinRequests:(S.config.joinRequests||[]).filter(function(r){ return r.name!==name; })})); }
  function approvePending(id){
    persistEntries(S.entries.map(function(e){
      return e.id===id ? Object.assign({},e,{yanban:e.pending.yanban,meaning:e.pending.meaning,example:e.pending.example,pending:null}) : e;
    }));
  }
  function rejectPending(id){ persistEntries(S.entries.map(function(e){ return e.id===id ? Object.assign({},e,{pending:null}) : e; })); }

  var wrap = h('div', {class:'wrap space-y-lg'});

  var sec1 = h('section', null,
    h('h2', {class:'section-title mb-2', style:{display:'flex',alignItems:'center',gap:'8px'}}, icon('clock',17,{color:'var(--gold)'}), 'Pending translations ('+pending.length+')')
  );
  if (pending.length===0) sec1.appendChild(h('p', {class:'muted', style:{fontSize:'14px'}}, 'စောင့်ဆိုင်းနေသော တင်ပြချက် မရှိပါ'));
  else {
    var pl = h('div', {class:'space-y'});
    pending.forEach(function(e){
      pl.appendChild(h('div', {class:'card'},
        h('div', {style:{display:'flex',alignItems:'baseline',gap:'8px',flexWrap:'wrap'}},
          h('span', {class:'serif', style:{fontSize:'16px',color:'#F5EFDF'}}, e.en),
          h('span', {style:{color:'#5c6472'}}, '→'),
          h('span', {class:'mono', style:{fontSize:'14px',color:'var(--gold-light)'}}, e.pending.yanban)
        ),
        e.pending.meaning ? h('p', {style:{fontSize:'14px',color:'var(--text-dim)',marginTop:'4px'}}, e.pending.meaning) : null,
        h('p', {class:'mono', style:{fontSize:'10px',color:'var(--text-mute)',marginTop:'6px'}}, 'by '+e.pending.submittedBy),
        h('div', {class:'flex-row gap-1', style:{marginTop:'10px'}},
          h('button', {class:'btn btn-green', onclick:function(){ approvePending(e.id); }}, icon('check',13), 'Approve'),
          h('button', {class:'btn btn-outline-red', onclick:function(){ rejectPending(e.id); }}, icon('xcircle',13), 'Reject')
        )
      ));
    });
    sec1.appendChild(pl);
  }
  wrap.appendChild(sec1);

  var sec2 = h('section', null,
    h('h2', {class:'section-title mb-2', style:{display:'flex',alignItems:'center',gap:'8px'}}, icon('userplus',17,{color:'var(--gold)'}), 'Join requests ('+(S.config.joinRequests||[]).length+')')
  );
  var jl = h('div', {class:'space-y'});
  (S.config.joinRequests||[]).forEach(function(r){
    jl.appendChild(h('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--panel)',border:'1px solid var(--border)',borderRadius:'6px',padding:'10px 16px'}},
      h('span', {style:{fontSize:'14px'}}, r.name),
      h('div', {class:'flex-row gap-1'},
        h('button', {class:'btn btn-green', onclick:function(){ approveJoin(r.name); }}, 'Approve'),
        h('button', {class:'btn btn-ghost', style:{fontSize:'12px',padding:'6px 12px'}, onclick:function(){ dismissJoin(r.name); }}, 'Dismiss')
      )
    ));
  });
  if ((S.config.joinRequests||[]).length===0) jl.appendChild(h('p', {class:'muted', style:{fontSize:'14px'}}, 'Join request မရှိပါ'));
  sec2.appendChild(jl);
  wrap.appendChild(sec2);

  var sec3 = h('section', null,
    h('h2', {class:'section-title mb-2', style:{display:'flex',alignItems:'center',gap:'8px'}}, icon('users',17,{color:'var(--gold)'}), 'Developers ('+(S.config.developers||[]).length+')')
  );
  var devInput = h('input', {class:'input', id:'team-newdev', placeholder:'Developer name ထည့်ပါ', value:ui.newDev, oninput:function(e){ ui.newDev=e.target.value; }});
  sec3.appendChild(h('div', {class:'flex-row gap-1', style:{marginBottom:'12px'}}, devInput, h('button', {class:'btn btn-gold', onclick:addDeveloper}, 'Add')));
  var dl = h('div', {class:'space-y'});
  (S.config.developers||[]).forEach(function(d){
    dl.appendChild(h('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--panel)',border:'1px solid var(--border)',borderRadius:'6px',padding:'10px 16px'}},
      h('span', {style:{fontSize:'14px'}}, d.name),
      h('button', {class:'btn-outline-red btn', onclick:function(){ removeDeveloper(d.name); }}, icon('userminus',13), 'Remove')
    ));
  });
  if ((S.config.developers||[]).length===0) dl.appendChild(h('p', {class:'muted', style:{fontSize:'14px'}}, 'Developer မရှိသေးပါ'));
  sec3.appendChild(dl);
  wrap.appendChild(sec3);

  return h('div', {class:'px', style:{paddingTop:'32px',paddingBottom:'32px'}}, wrap);
}

/* ================= boot ================= */
try {
  init();
} catch (err) {
  root.innerHTML = "";
  root.appendChild(h('div', {style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',textAlign:'center'}},
    h('div', null,
      h('p', {style:{color:'var(--red)',fontSize:'16px',marginBottom:'8px'}}, 'App error တစ်ခု ဖြစ်ပွားနေပါသည်'),
      h('p', {class:'mono', style:{fontSize:'11px',color:'var(--text-mute)',whiteSpace:'pre-wrap'}}, String(err && err.message))
    )
  ));
}
})();
</script>
