name: Backup dictionary data

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download data from Firestore
        run: node scripts/backup.mjs
      - name: Commit if changed
        run: |
          git config user.name "yangban-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/yangban-backup.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily data backup $(date -u +%F)"
            git push
          fi
